version: '3.4'

services:
  flowerss-bot:
    build:
      network: host
      context: .
      dockerfile: Dockerfile
    image: flowerss-bot
    volumes:
      - ./conf:/root/.flowerss
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
      restart_policy:
        condition: on-failure
